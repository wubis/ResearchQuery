[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "research-query"
version = "0.1.0"
description = "Evidence-backed Johns Hopkins faculty research corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "sentence-transformers>=3.4,<6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_query"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL with PostgreSQL and pgvector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
mypy_path = "src"
